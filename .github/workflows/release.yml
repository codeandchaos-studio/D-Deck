name: Automated D-Deck Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile & Build Frontend + Electron
        run: npm run build

      - name: Package Windows Binaries (Installer & Portable)
        run: npx electron-builder --win --publish never

      - name: Ensure Dynamic Release Notes
        shell: pwsh
        run: |
          if (!(Test-Path "RELEASE_NOTES.md")) {
            $tag = "${{ github.ref_name || inputs.release_version }}"
            $content = @"
          # 🚀 D-Deck Release $tag
          > **Futuristic Desktop HUD Widget & Personal Command Center**
          > Built by **Code & Chaos** — *We Built Stuff*

          ---

          ### ✨ Key Highlights in this Build
          - Official update release for D-Deck personal command center.

          ---

          ### 📦 Downloads & Binaries
          | File | Description | Download |
          | :--- | :--- | :--- |
          | **Windows Installer** | Recommended for Windows 10/11 with desktop shortcut & auto-start | D-Deck-Setup-*.exe |
          | **Windows Portable** | Zero installation single executable, runs immediately from USB or folder | D-Deck-Portable-*.exe |

          ---
          *Open Source • MIT License • Crafted by Code & Chaos*
          "@
            Set-Content -Path "RELEASE_NOTES.md" -Value $content -Encoding utf8
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/D-Deck-Setup-*.exe
            release/D-Deck-Portable-*.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          name: D-Deck ${{ github.ref_name || inputs.release_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
